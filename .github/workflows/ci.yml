name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workspace mirrors the local layout: android/ and common/ (latest main;
# a release pins it with COMMON_REF instead) side by side.
jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out android
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: android
          persist-credentials: false

      - name: Check out common
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: stevennight/NyaRemoteControl-common
          path: common
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust and Android NDK
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          ndk="$(sed -n 's/^val ndkVersionPinned = "\(.*\)"$/\1/p' android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: android -> ../target

      - name: Install cargo-ndk
        run: cargo ndk --version || cargo install cargo-ndk --locked

      - name: Check version
        working-directory: android
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Cargo.toml version differs from VERSION $version" >&2; exit 1; }

      - name: Test the Rust core
        working-directory: android
        # Not --locked: common main may be ahead of this Cargo.lock (releases build with --locked).
        run: cargo test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Lint, unit test and assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nya-remote-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
